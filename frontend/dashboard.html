<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompliBot Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="css/style.css">


    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo-section">
            <h2>COMPLIBOT</h2>
            <p>Firewall Automation</p>
        </div>

        <nav class="menu">

            <a href="dashboard.html" class="menu-item active">
                Dashboard
            </a>

            <a href="bot.html" class="menu-item">
                CompliBot AI
            </a>

            <a href="rules.html" class="menu-item">
                Firewall Rules
            </a>

            <a href="logs.html" class="menu-item">
                Audit Logs
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Top Navbar -->
        <header class="topbar">

            <div class="page-title">
                <h1>Dashboard</h1>
                <p>Firewall Automation Overview</p>
            </div>

            <div class="topbar-right">

                <input
                    type="text"
                    placeholder="Search..."
                    class="search-box"
                >

            </div>

        </header>

        <!-- KPI Cards -->
        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Rules</h3>
                <h1 id="totalRules">0</h1>
            </div>

            <div class="stat-card">
                <h3>Approved Rules</h3>
                <h1 id="approvedRules">0</h1>
            </div>

            <div class="stat-card">
                <h3>Rejected Rules</h3>
                <h1 id="rejectedRules">0</h1>
            </div>

            <div class="stat-card">
                <h3>High Risk Requests</h3>
                <h1 id="highRiskRules">0</h1>
            </div>

        </section>

        <!-- Charts -->
        <section class="charts-section">

            <div class="chart-card">
                <h3>Allowed vs Rejected Rules</h3>
                <canvas id="ruleChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Risk Distribution</h3>
                <canvas id="riskChart"></canvas>
            </div>

        </section>

        <!-- Recent Activity -->
        <section class="recent-activity">

            <div class="activity-card">

                <h3>Recent Requests</h3>

                <table>

                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Request</th>
                            <th>Status</th>
                            <th>Date/Time</th>
                        </tr>
                    </thead>

                    <tbody id="recentRequests">

                    </tbody>

                </table>

            </div>

        </section>

    

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
